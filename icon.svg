<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Radial Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#cyanGlow)" />

  <!-- Outer Ring (Oxygenator / CPB circuit) -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#38bdf8" stroke-width="16" opacity="0.9" />

  <!-- Medical Cross Accent -->
  <rect x="228" y="146" width="56" height="220" rx="8" fill="#ef4444" opacity="0.25" />
  <rect x="146" y="228" width="220" height="56" rx="8" fill="#ef4444" opacity="0.25" />

  <!-- ECG Waveform -->
  <path d="M 90 256 L 170 256 L 195 280 L 225 120 L 270 380 L 305 230 L 330 256 L 422 256"
        fill="none" stroke="#ef4444" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Pulse Peak Dot -->
  <circle cx="225" cy="120" r="12" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
